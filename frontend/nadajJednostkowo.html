<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/nadajSeryjnie.css" />
    <title>MAC DATABASE</title>
  </head>
  <body>
    <header>
      <img src="img/logo.svg" alt="logo" class="logo" />

      <div class="options">
        <div class="option">
          <span>Nadaj</span>
          <div class="dropdown-menu">
            <a href="#">Nadaj seryjnie</a>
            <a href="#">Nadaj jednostkowo</a>
          </div>
        </div>

        <div class="option">
          <span>Zwolnij</span>
        </div>

        <div class="option">
          <a href="#">Wyszukaj</a>
        </div>
      </div>
      <div class="logout">
        <button>Wyloguj</button>
      </div>
    </header>
    <article>

        <div class="addAdres">
          <div class="addTypNyumberAmount">
            <h3>Typ urzadzenia:</h3>
            <input type="text" placeholder="Tu wpisz typ urządzenia">
            <h3>Numer urzadzenia:</h3>
            <input type="text" placeholder="Tu wpisz typ urządzenia">
            <h3>Ilosc adresow:</h3>
            <input type="text" placeholder="Tu wpisz typ urządzenia">
          </div>
          <div class="notediv">
            <h3>Notatka:</h3>
            <input type="text" placeholder="Tu wpisz typ urządzenia" class="note">
          <button>Przydziel</button>
          </div>
        </div>
      <h2>Ostatnio nadane:</h2>

      <table>
        <tr>
          <th>Lp.</th>
          <th>urzadzenie</th>
          <th>mac adres</th>
          <th>ilosc</th>
        </tr>
        <tbody id="macTable">
        </tbody>
        </tr>
      </table>

      <img src="img/logo.svg" alt="background G-CODE logo" />
    </article>
    <footer>
      <p>&copy; 2026 MAC DATABASE by Emil Guliński. All rights reserved.</p>
    </footer>
  </body>
</html>
