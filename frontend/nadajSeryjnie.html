<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/nadajSeryjnie.css" />
    <title>MAC DATABASE</title>
  </head>
  <body>
    <header>
      <img src="img/logo.svg" alt="logo" class="logo" />

      <div class="options">
        <div class="option">
          <span>Nadaj</span>
          <div class="dropdown-menu">
            <a href="nadajSeryjnie.html">Nadaj seryjnie</a>
            <a href="nadajJednostkowo.html">Nadaj jednostkowo</a>
          </div>
        </div>

        <div class="option">
          <a href="zwolnij.html">Zwolnij</a>
        </div>

        <div class="option">
          <a href="wyszukaj.html">Wyszukaj</a>
        </div>
      </div>
      <div class="logout">
        <button>Wyloguj</button>
      </div>
    </header>
    <article>

        <div class="addAdres">
          <div class="addTypNyumberAmount">
            <h3>Typ urzadzenia:</h3>
            <input type="text" placeholder="Typ urządzenia np. GM-12">
            <h3>Numer urzadzenia:</h3>
            <input type="text" placeholder="Numer SN z tabliczki">
            <h3>Ilosc adresow:</h3>
            <input type="text" placeholder="Tu wpisz ilość niezbędnych mac-adresów">
          </div>
          <div class="notediv">
            <h3>Notatka:</h3>
            <input type="text" placeholder="Notatka" class="note">
          </div>
          <div class="addSerialnumber">
            <h3>Numer poczatkowy:</h3>
            <input type="text" placeholder="Pierwszy numer z serji">
            <h3>Ilosc urzadzen:</h3>
            <input type="text" placeholder="Ilość w serji">
          <button>Przydziel</button>
          </div>
        </div>
      <h2>Ostatnio nadane:</h2>

      <table>
        <tr>
          <th>Lp.</th>
          <th>urzadzenie</th>
          <th>mac adres</th>
          <th>Ilosc</th>
          <th>data nadania</th>
        </tr>
        <tbody id="macTable">
        </tbody>
        </tr>
      </table>

      <img src="img/logo.svg" alt="background G-CODE logo" />
    </article>
    <footer>
      <p>&copy; 2026 MAC DATABASE by Emil Guliński. All rights reserved.</p>
    </footer>
  </body>
</html>
