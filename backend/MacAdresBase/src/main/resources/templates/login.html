<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAC-DATABASE</title>
    <link rel="stylesheet" href="css/loginstyle.css" />
  </head>

  <body>
    <div class="login_zone">
      <div class="header_login_zone">
        <img src="img/logo.svg" alt="MAC DATABASE" />
        <h1>MAC-DATABASE</h1>
      </div>

      <div class="login">
        <h2>Zaloguj się</h2>

        <form
          class="login-form"
          id="login-form"
          action="login.php"
          method="post"
        >
          <div class="input_zone">
            <div class="form-group">
              <label for="username">Nazwa użytkownika:</label>
              <input type="text" id="username" name="username" required />
            </div>

            <div class="form-group">
              <label for="password">Hasło:</label>
              <input type="password" id="password" name="password" required />
            </div>
          </div>
        </form>

        <button type="submit" form="login-form">Zaloguj</button>
      </div>
    </div>
  </body>
  <footer>
    <p>&copy; 2026 MAC DATABASE by Emil Guliński. All rights reserved.</p>
  </footer>
</html>
